spring.application.name=piggybank-modulith

spring.jackson.write.write-bigdecimal-as-plain=true

spring.datasource.url=jdbc:postgresql://localhost:5444/kdg
spring.datasource.username=kdg
spring.datasource.password=kdg
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
# every entity of ours names its schema; this default only places Spring Modulith's event_publication table
spring.jpa.properties.hibernate.default_schema=kdg_events

spring.shell.interactive.enabled=true
spring.shell.script.enabled=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=user
spring.rabbitmq.password=password

# three retries, after 1, 2 and 4 seconds, before a message is dead-lettered
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2

# the RabbitMQ publishers run one at a time, so events are sent in commit order
spring.task.execution.pool.core-size=1
