spring.application.name=piggybank-modulith

spring.jackson.write.write-bigdecimal-as-plain=true

spring.datasource.url=jdbc:postgresql://localhost:5444/kdg
spring.datasource.username=kdg
spring.datasource.password=kdg
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
# every entity of ours names its schema; this default only places Spring Modulith's event_publication table
spring.jpa.properties.hibernate.default_schema=kdg_events

spring.shell.interactive.enabled=true
spring.shell.script.enabled=true

# @ApplicationModuleListener runs every listener asynchronously on this executor. Two deposits projected on two
# threads at once both load the SavingsPromise before either saves it, and one update is lost. One thread runs
# the listeners one at a time, in the order their transactions committed. (The queue is unbounded, so max-size
# plays no part.)
spring.task.execution.pool.core-size=1
